[package]
name = "serde_kyaml"
version = "0.1.0"
authors = ["Sondre Aasemoen <sondre@eons.io>"]
edition = "2024"
description = "KYAML (KEP-5295) serializer for serde: a strict, unambiguous subset of YAML"
documentation = "https://github.com/sondr3/serde_kyaml"
homepage = "https://github.com/sondr3/serde_kyaml"
readme = "README.md"
repository = "https://github.com/sondr3/serde_kyaml"
license = "MIT OR Apache-2.0"

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
unicode-properties = "0.1"
yaml_serde = "0.10"

[dev-dependencies]
indoc = "2"
serde = { version = "1", features = ["derive"] }
